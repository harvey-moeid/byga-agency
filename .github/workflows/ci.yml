name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(find ~/.cache/ms-playwright -path '*/chrome-linux64/chrome' -o -path '*/chrome-linux/chrome' | head -1) npm run test:e2e
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: byga-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Account and database IDs are non-secret production resource identifiers.
      # Variables or secrets can override these verified defaults.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '07086b4d368d0a37ebcbbf186e51eecf' }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID || secrets.CLOUDFLARE_D1_DATABASE_ID || '597c359f-f9a8-460f-9dcf-58e106eb3dee' }}
      BYGA_APP_URL: https://agency.muidsoft.com
      BYGA_ENABLE_WORKERS_AI: ${{ vars.BYGA_ENABLE_WORKERS_AI }}
    steps:
      - name: Check production configuration
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy
